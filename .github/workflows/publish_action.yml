name: Check and publish Civitai Discovery Hub

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt
      - name: Check Python and JavaScript
        run: |
          python -m compileall -q -l .
          for file in js/*.js; do node --input-type=module --check < "$file"; done
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.mjs
      - name: Check publication trigger
        id: release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$BEFORE" =~ ^0+$ ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- pyproject.toml)" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

  publish-node:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish to the Comfy Registry
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
